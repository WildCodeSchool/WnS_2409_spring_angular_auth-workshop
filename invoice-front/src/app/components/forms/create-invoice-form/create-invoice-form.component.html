<h2>Créer une facture</h2>

<form #invoiceForm="ngForm" (ngSubmit)="onSubmit(invoiceForm)">
  <div>
    <label for="label">Libellé</label>
    <input
      type="text"
      id="label"
      name="label"
      required
      [(ngModel)]="invoice.description"
    />
    @if (invoiceForm.submitted && !invoice.description) {
      <span>Le libellé est requis.</span
    >
    }

  </div>

  <div>
    <label for="amount">Montant</label>
    <input
      type="number"
      id="amount"
      name="amount"
      required
      min="1"
      [(ngModel)]="invoice.amount"
    />
    @if (invoiceForm.submitted && invoice.amount <= 0) {
    <span>Le montant doit être supérieur à 0.</span>
    }
  </div>

  <div>
    <label for="date">Date</label>
    <input
      type="date"
      id="date"
      name="date"
      required
      [(ngModel)]="invoice.date"
    />
    @if (invoiceForm.submitted && !invoice.date) {
    <span>La date est requise.</span>
    }
  </div>

  <button type="submit" [disabled]="invoiceForm.invalid">Créer</button>
</form>
